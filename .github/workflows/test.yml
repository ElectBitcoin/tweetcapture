name: Nightly Screenshot Test

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Screenshot tweet
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):latest
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            $IMAGE \
            https://x.com/jack/status/20 \
            -o test_output.png \
            --overwrite

      - name: Validate image
        run: |
          pip install Pillow
          python3 - <<'EOF'
          import sys
          from PIL import Image
          try:
              img = Image.open("test_output.png")
              w, h = img.size
              print(f"Image: {w}x{h} px, mode={img.mode}")
              if w < 400 or h < 100:
                  print(f"FAIL: image too small ({w}x{h}), expected at least 400x100")
                  sys.exit(1)
              print("PASS")
          except Exception as e:
              print(f"FAIL: {e}")
              sys.exit(1)
          EOF

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: ${{ github.workspace }}/test_output.png
          if-no-files-found: warn
